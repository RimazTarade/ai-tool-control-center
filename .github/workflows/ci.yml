name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.11.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned tools
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          python -m pip install uv==0.11.30
      - name: Repository policy
        run: python scripts/repository_policy.py .
      - name: Rust
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Python
        shell: pwsh
        run: |
          uv sync --project engine/python --frozen
          uv run --project engine/python ruff check engine/python
          uv run --project engine/python mypy engine/python/src
          $env:PYTHONPATH="engine/python/src"
          python -m unittest discover -s engine/python/tests -v
      - name: Frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - name: Tauri release compile
        run: pnpm tauri build --no-bundle
